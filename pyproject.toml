[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpnctl"
version = "0.1.0"
description = "A macOS and Linux VPN client that works with no account, no payment and no server of your own"
readme = "README.md"
requires-python = ">=3.11"
# SPDX string plus the file, which is the current PEP 639 form. The old
# license = { text = "MIT" } table is deprecated and build backends warn
# about it.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikheil Kuzmidi" }]
keywords = ["vpn", "wireguard", "openvpn", "privacy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vpnctl = "vpnctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vpnctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
