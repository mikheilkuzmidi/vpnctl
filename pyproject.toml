[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpnctl"
version = "0.1.0"
description = "A macOS VPN client that works with no account, no payment and no server of your own"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vpnctl = "vpnctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vpnctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
